   <text style="font-size: 9px; font-family: 'Inter'; fill: #46585e" transform="translate(75.866484 46.208584)">Guadagno o perdita totale a oggi, cedole comprese, di un BTP o Bund decennale nuovo,</text>
   <text style="font-size: 9px; font-family: 'Inter'; fill: #46585e" transform="translate(166.291172 60.460049)">secondo il mese in cui è stato comprato, in %</text>
  </g>
  <g id="text_27">
   <text style="font-size: 7px; font-family: 'Inter'; fill: #6b7b80" transform="translate(14.4 306.823257)">Fonte: elaborazione Grinny Finanza su dati Banca d'Italia (BMK0200) e Deutsche Bundesbank (BBSIS), estratti il 25/10/2026.</text>
   <text style="font-size: 7px; font-family: 'Inter'; fill: #6b7b80" transform="translate(14.4 318.074731)">Cedole più valore del titolo, lordo d'imposta. BTP al 30/09/2026, Bund al 23/10/2026; rendimenti interpolati sulla vita residua.</text>
  </g>
