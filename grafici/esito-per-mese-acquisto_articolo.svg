   <text style="font-size: 9px; font-family: 'Inter'; fill: #46585e" transform="translate(184.930313 60.547236)">e valutati al 30 settembre 2026, in %</text>
  </g>
  <g id="text_27">
   <text style="font-size: 7px; font-family: 'Inter'; fill: #6b7b80" transform="translate(14.4 306.823257)">Fonte: elaborazione Grinny Finanza su dati Banca d'Italia (BMK0200) e Deutsche Bundesbank (BBSIS), estratti il 25/10/2026.</text>
   <text style="font-size: 7px; font-family: 'Inter'; fill: #6b7b80" transform="translate(14.4 318.07145)">Cedole più valore del titolo, lordo d'imposta; titoli valutati al rendimento della loro vita residua.</text>
  </g>
