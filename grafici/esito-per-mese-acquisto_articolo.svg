   <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; text-anchor: end; fill: #6b7b80" x="516.96" y="320.151523" transform="rotate(-0 516.96 320.151523)">Grinny Finanza</text>
  </g>
